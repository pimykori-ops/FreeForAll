<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Free For All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   FREE FOR ALL — design tokens (ThoughtStream design system)
========================================================================= */
:root{
  --primary:#78716C;
  --secondary:#A8A29E;
  --tertiary:#1C1917;

  --bg:#FAFAF9;
  --surface:#F5F5F4;
  --surface-raised:#EFEDEB;

  --text-primary:#1C1917;
  --text-secondary:#57534E;
  --text-tertiary:#A8A29E;

  --border-subtle:#E7E5E4;
  --border-medium:#D6D3D1;
  --border-strong:#A8A29E;

  --success:#65A30D;
  --warning:#CA8A04;
  --error:#DC2626;
  --info:#78716C;

  --font-display:'Libre Baskerville', Georgia, 'Times New Roman', serif;
  --font-body:'Inter', -apple-system, 'Segoe UI', Helvetica, sans-serif;
  --font-mono:'Source Code Pro','Fira Code', Consolas, monospace;

  --sp-1:12px; --sp-2:24px; --sp-3:36px; --sp-4:48px;
  --sp-5:60px; --sp-6:72px; --sp-7:96px; --sp-8:120px;

  --ease:cubic-bezier(.22,.61,.36,1);
  --focus-ring:0 0 0 2px var(--bg), 0 0 0 4px var(--primary);
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text-primary);
  overflow:hidden;
  position:relative;
  -webkit-font-smoothing:antialiased;
}
[dir="rtl"]{ direction:rtl; }
a{ color:inherit; }
button{ font:inherit; }
:focus-visible{ outline:none; box-shadow:var(--focus-ring); }

.screen{
  position:fixed; inset:0; z-index:1;
  display:flex; align-items:center; justify-content:center;
  padding:var(--sp-4) var(--sp-2);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .5s var(--ease), visibility 0s linear .5s;
  overflow-y:auto;
}
.screen.active{
  opacity:1; visibility:visible; pointer-events:auto;
  transition:opacity .5s var(--ease);
}

/* brand mark — present on every screen, always in English */
.brand{
  position:fixed; top:var(--sp-2); left:50%; transform:translateX(-50%);
  z-index:20;
  font-family:var(--font-display);
  font-weight:700; letter-spacing:.14em; font-size:13px;
  color:var(--text-primary);
  text-transform:uppercase;
  pointer-events:none; user-select:none;
}
.brand em{ font-style:normal; color:var(--primary); }

.eyebrow{
  font-family:var(--font-mono); font-weight:500; letter-spacing:.08em;
  text-transform:uppercase; font-size:11px; color:var(--primary);
  margin-bottom:var(--sp-1);
}

/* ---------- buttons (per ThoughtStream spec) ---------- */
.btn{
  font-family:var(--font-body); font-weight:600; font-size:15px;
  padding:12px 24px;
  border-radius:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
}
.btn-primary{
  background:var(--primary); color:var(--bg); border:1px solid var(--primary);
}
.btn-primary:hover{ background:#57534E; border-color:#57534E; }
.btn-primary:active{ background:#44403C; border-color:#44403C; }
.btn-secondary{
  background:transparent; color:var(--primary); border:1px solid var(--border-medium);
}
.btn-secondary:hover{ background:var(--surface); }
.btn-secondary:active{ background:var(--border-subtle); }
.btn-ghost{
  background:transparent; color:var(--primary); border:none;
}
.btn-ghost:hover{ background:var(--surface); }
.btn-ghost:active{ background:var(--border-subtle); }

/* ================= SCREEN 1 — LANGUAGE SELECT ================= */
#screen-lang .inner{ text-align:center; max-width:460px; width:100%; }
.site-title{
  font-family:var(--font-display);
  font-size:clamp(34px,7vw,48px);
  font-weight:700;
  letter-spacing:-.01em;
  color:var(--text-primary);
}
.site-title em{ font-style:italic; font-weight:400; color:var(--primary); }
.site-sub{
  margin-top:var(--sp-1);
  font-size:13px; color:var(--text-tertiary); letter-spacing:.02em;
}
.lang-list{ margin-top:var(--sp-5); border-top:1px solid var(--border-subtle); }
.lang-item{
  width:100%;
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 4px;
  background:transparent; border:none; border-bottom:1px solid var(--border-subtle);
  cursor:pointer; text-align:start;
  transition:background .2s var(--ease), padding-inline-start .2s var(--ease);
}
.lang-item:hover{ background:var(--surface); padding-inline-start:14px; }
.lang-item .name{
  font-family:var(--font-display); font-size:22px; font-weight:400; color:var(--text-primary);
}
.lang-item .code{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; color:var(--text-tertiary);
}

/* ================= SCREEN 2 — THANKS (yes/no dodge) ================= */
#screen-thanks .inner{ text-align:center; max-width:460px; width:100%; }
.thanks-title{
  font-family:var(--font-display);
  font-size:clamp(24px,4vw,30px);
  font-weight:700;
  line-height:1.3;
  margin-top:6px;
}
.choice-area{
  position:relative;
  margin-top:var(--sp-5);
  min-height:140px;
  width:100%;
  display:flex; align-items:center; justify-content:center; gap:20px;
}
#btnYes{ position:relative; z-index:5; }
#btnNo{ position:relative; z-index:2; }
#btnNo.is-floating{
  position:absolute;
  transition:left .28s var(--ease), top .28s var(--ease);
}

/* ================= SCREEN 3 — THANK-YOU MESSAGE ================= */
#screen-message .inner{ text-align:center; max-width:480px; width:100%; }
.message-card{
  cursor:pointer;
  border:1px solid var(--border-subtle);
  background:var(--bg);
  padding:var(--sp-5) var(--sp-3);
  transition:border-color .2s var(--ease), background .2s var(--ease);
}
.message-card:hover{ border-color:var(--border-medium); background:var(--surface); }
.message-text{
  font-family:var(--font-display);
  font-size:clamp(20px,3.4vw,25px);
  line-height:1.5;
  font-weight:400;
  color:var(--text-primary);
}
.message-hint{
  margin-top:var(--sp-2);
  font-family:var(--font-mono);
  font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary);
}

/* ================= SCREEN 4 — CELEBRATION ================= */
#screen-celebrate{ cursor:pointer; }
.particle{
  position:absolute;
  font-family:var(--font-display);
  font-weight:700; font-style:italic;
  color:var(--primary);
  opacity:0;
  white-space:nowrap;
  will-change:transform,opacity;
  pointer-events:none;
}
.particle.emoji{ font-family:var(--font-body); font-style:normal; }
.celebrate-skip{
  position:absolute; bottom:var(--sp-3); left:50%; transform:translateX(-50%);
  font-family:var(--font-mono);
  font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary);
}

/* ================= SCREEN 5 — MAIN MENU ================= */
#screen-menu .inner{ width:100%; max-width:840px; }
.menu-title{ text-align:center; margin-bottom:var(--sp-5); color:var(--text-primary); }
.menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-1); }
@media(max-width:640px){ .menu-grid{ grid-template-columns:1fr; } }
.menu-card{
  text-align:start;
  padding:var(--sp-3);
  min-height:132px;
  background:var(--surface);
  border:1px solid var(--border-medium);
  cursor:pointer;
  display:flex; flex-direction:column; justify-content:flex-end; gap:8px;
  transition:border-color .2s var(--ease), background .2s var(--ease);
}
.menu-card:hover{ border-color:var(--primary); background:var(--surface-raised); }
.menu-card .label{ color:var(--text-tertiary); }
.menu-card h3{ color:var(--text-primary); }
.menu-card p{ color:var(--text-secondary); }

/* ================= SCREEN 6 — CATEGORY / LIST ================= */
#screen-category{ align-items:flex-start; }
#screen-category .inner{
  width:100%; max-width:780px; margin:0 auto;
  padding-top:var(--sp-7); padding-bottom:var(--sp-6);
}
.cat-back{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-mono);
  font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  margin-bottom:var(--sp-3);
}
.cat-title{
  font-family:var(--font-display); font-weight:700;
  font-size:clamp(26px,5vw,36px);
  margin-bottom:var(--sp-2);
}
.cat-note{
  font-size:13px; color:var(--text-secondary); margin-bottom:var(--sp-4);
  border-inline-start:2px solid var(--primary);
  padding:2px 0 2px 14px;
}
[dir="rtl"] .cat-note{ padding:2px 14px 2px 0; }
.cat-note .fill{ color:var(--text-primary); font-family:var(--font-mono); font-weight:500; }

.lists-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-5); }
@media(max-width:640px){ .lists-grid{ grid-template-columns:1fr; gap:var(--sp-3); } }

.list-section h4{
  font-family:var(--font-body); font-weight:600; font-size:11px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--text-tertiary);
  margin-bottom:8px;
  padding-bottom:var(--sp-1);
  border-bottom:1px solid var(--border-subtle);
}
.link-list{ list-style:none; }
.link-list li{ border-bottom:1px solid var(--border-subtle); }
.link-list a{
  display:flex; align-items:center; gap:14px;
  padding:16px 4px;
  text-decoration:none; color:var(--text-primary);
  font-size:15px;
  transition:background .2s var(--ease), padding-inline-start .2s var(--ease);
}
.link-list a .num{
  font-family:var(--font-mono); font-size:12px; color:var(--text-tertiary); min-width:24px;
}
.link-list a:hover{ background:var(--surface); padding-inline-start:10px; }
.link-list a:active{ background:var(--surface-raised); }
.link-list a.is-empty{ color:var(--text-tertiary); font-style:italic; cursor:default; }
.link-list a.is-empty:hover{ background:transparent; padding-inline-start:4px; }

.single-link-wrap{ display:flex; justify-content:center; margin-top:var(--sp-3); }
.single-link{
  display:flex; align-items:center; justify-content:center; gap:10px;
  min-width:280px;
  padding:20px 36px;
  border:1px solid var(--border-medium);
  background:var(--bg);
  color:var(--text-primary);
  font-family:var(--font-body); font-weight:600; font-size:16px;
  text-decoration:none;
  transition:border-color .2s var(--ease), background .2s var(--ease);
}
.single-link:hover{ border-color:var(--primary); background:var(--surface); }
.single-link.is-empty{ color:var(--text-tertiary); font-style:italic; cursor:default; }
.single-link.is-empty:hover{ border-color:var(--border-medium); background:var(--bg); }

/* ================= FOOTER ================= */
.site-footer{
  position:fixed; bottom:var(--sp-1); left:50%; transform:translateX(-50%);
  z-index:5; text-align:center; font-size:11px; color:var(--text-tertiary);
  line-height:1.6; pointer-events:none;
  max-width:92vw;
}
.site-footer a{ color:var(--primary); pointer-events:auto; text-decoration:none; }
.site-footer a:hover{ color:var(--text-primary); }

::-webkit-scrollbar{ width:6px; }
::-webkit-scrollbar-thumb{ background:var(--border-medium); }

@media(prefers-reduced-motion: reduce){
  *{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
}

</head>

<!-- ============ SCREEN 1: LANGUAGE SELECT ============ -->
<section class="screen active" id="screen-lang">

    <h1 class="site-title">Free <em>For</em> All</h1>

      <button class="lang-item" data-lang="ru"><span class="name">Русский</span><span class="code">RU</span></button>

</section>

<section class="screen" id="screen-thanks">
  <div class="inner">
    <p class="eyebrow" data-i18n="thanksEyebrow"></p>

      <button class="btn btn-secondary" id="btnNo" data-i18n="no"></button>
    </div>
  </div>
</section>

<!-- ============ SCREEN 3: THANK YOU MESSAGE ============ -->
<section class="screen" id="screen-message">

</section>

<!-- ============ SCREEN 4: CELEBRATION ============ -->
<section class="screen" id="screen-celebrate">

<!-- ============ SCREEN 5: MAIN MENU ============ -->
<section class="screen" id="screen-menu">

        <p data-i18n="catTelegramDesc"></p>
      </div>
    </div>
  </div>
</section>

<!-- ============ SCREEN 6: CATEGORY / LIST ============ -->
<section class="screen" id="screen-category">

    <button class="cat-back btn-ghost" id="catBack" data-i18n="back"></button>
    <h2 class="cat-title" id="catTitle"></h2>

/* ---- thanks screen: the dodging "No" button ----
   Design: #btnYes always stays in normal document flow with a HIGHER
   z-index than #btnNo, so even if the two ever visually overlap, a
   click always lands on Yes — this is what fixes the bug where Yes
   could stop responding after No relocated on top of it. */
const btnNo = document.getElementById("btnNo");
const btnYes = document.getElementById("btnYes");
const choiceArea = document.getElementById("choiceArea");

function resetChoice(){
  btnNo.classList.remove("is-floating");
  btnNo.style.left = ""; btnNo.style.top = "";
}

function dodge(){
  const areaRect = choiceArea.getBoundingClientRect();
  const noRect = btnNo.getBoundingClientRect();
  const yesRect = btnYes.getBoundingClientRect();

  if(!btnNo.classList.contains("is-floating")){
    btnNo.classList.add("is-floating");
    btnNo.style.left = (noRect.left - areaRect.left) + "px";
    btnNo.style.top = (noRect.top - areaRect.top) + "px";
    // force reflow so the browser registers the starting point before animating
    void btnNo.offsetWidth;
  }

  const maxX = Math.max(areaRect.width - noRect.width - 8, 20);
  const maxY = Math.max(areaRect.height - noRect.height - 8, 20);

  // pick a spot, retrying a few times if it lands on top of Yes
  const yesRel = {
    left: yesRect.left - areaRect.left, top: yesRect.top - areaRect.top,
    right: yesRect.right - areaRect.left, bottom: yesRect.bottom - areaRect.top
  };
  const pad = 16;
  let x, y, tries = 0;
  do{
    x = Math.random() * maxX;
    y = Math.random() * maxY;
    tries++;
  } while(
    tries < 10 &&
    x < yesRel.right + pad && x + noRect.width > yesRel.left - pad &&
    y < yesRel.bottom + pad && y + noRect.height > yesRel.top - pad
  );

  btnNo.style.left = x + "px";
  btnNo.style.top = y + "px";
}

let dodgeCooldown = false;
function maybeDodge(clientX, clientY){
  if(dodgeCooldown) return;
  const r = btnNo.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const dist = Math.hypot(clientX - cx, clientY - cy);
  const threshold = Math.max(r.width, r.height) * 1.1;
  if(dist < threshold){
    dodge();
    dodgeCooldown = true;
    setTimeout(()=>{ dodgeCooldown = false; }, 320);
  }
}

document.addEventListener("mousemove", (e)=>{
  if(!document.getElementById("screen-thanks").classList.contains("active")) return;
  maybeDodge(e.clientX, e.clientY);
});
document.addEventListener("touchmove", (e)=>{
  if(!document.getElementById("screen-thanks").classList.contains("active")) return;
  const touch = e.touches[0];
  if(touch) maybeDodge(touch.clientX, touch.clientY);
}, {passive:true});
["touchstart","pointerdown","click","mouseenter"].forEach(evt=>{
  btnNo.addEventListener(evt, (e)=>{
    e.preventDefault();
    dodge();
  }, {passive:false});
});

/* ---- celebration ---- */
const CELEBRATE_ICONS = ["\u{1F4A5}","\u2764\uFE0F","\u{1F60D}","\u{1F4FD}","\u{1F3AC}","\u{1F3A5}"];
let celebrateTimers = [];

function runCelebration(){
  const stage = document.getElementById("screen-celebrate");
  stage.querySelectorAll(".particle").forEach(p=>p.remove());
  celebrateTimers.forEach(clearTimeout);
  celebrateTimers = [];

  const w = window.innerWidth, h = window.innerHeight;
  const items = [t("welcomeBack"), ...CELEBRATE_ICONS, t("welcomeBack"), ...CELEBRATE_ICONS, ...CELEBRATE_ICONS];

  items.forEach((label, i)=>{
    const delay = i * 320 + Math.random()*200;
    const timer = setTimeout(()=>{
      const el = document.createElement("div");
      const isText = label === t("welcomeBack");
      el.className = "particle" + (isText ? "" : " emoji");
      el.textContent = label;
      el.style.fontSize = isText ? "clamp(20px,3.6vw,30px)" : (Math.random()*24+26)+"px";
      const startX = Math.random() * (w - 120) + 20;
      const startY = h + 40;
      const endY = Math.random() * (h * 0.7) + 20;
      const drift = (Math.random() - 0.5) * 120;
      el.style.left = startX + "px";
      el.style.top = startY + "px";
      stage.appendChild(el);
      el.animate([
        { transform:"translate(0,0) rotate(0deg)", opacity:0 },
        { transform:`translate(${drift*0.3}px, ${-(startY-endY)*0.6}px) rotate(${(Math.random()-0.5)*12}deg)`, opacity:1, offset:0.25 },
        { transform:`translate(${drift}px, ${-(startY-endY)}px) rotate(${(Math.random()-0.5)*20}deg)`, opacity:0 }
      ], { duration: 2800 + Math.random()*900, easing:"cubic-bezier(.22,.61,.36,1)", fill:"forwards" });
      setTimeout(()=>el.remove(), 3800);
    }, delay);
    celebrateTimers.push(timer);
  });

  const goNext = setTimeout(()=>{ showScreen("screen-menu"); }, items.length*320 + 2200);
  celebrateTimers.push(goNext);
}
document.getElementById("screen-celebrate").addEventListener("click", ()=>{
  celebrateTimers.forEach(clearTimeout);
  showScreen("screen-menu");
});

function linkListHTML(list){
  return `<ul class="link-list">` + list.map((item,i)=>{
    const n = String(i+1).padStart(2,"0");
    if(item.url){
      return `<li><a href="${item.url}" target="_blank" rel="noopener"><span class="num">${n}</span>${item.name || item.url}</a></li>`;
    }
    return `<li><a class="is-empty"><span class="num">${n}</span>${t("emptyLink")}</a></li>`;
  }).join("") + `</ul>`;
}

function singleLinkHTML(item){
  if(item && item.url){
    return `<a class="single-link" href="${item.url}" target="_blank" rel="noopener">${item.name || item.url}</a>`;
  }
  return `<div class="single-link is-empty">${t("emptyLink")}</div>`;
}

function noteHTML(){
  return t("useNote").replace("{x}", `<span class="fill">VPN</span>`).replace("{y}", `<span class="fill">AdBlocker</span>`);
}

function openCategory(catKey){
  const titleEl = document.getElementById("catTitle");
  const bodyEl = document.getElementById("catBody");

  if(catKey === "telegramCollection"){
    titleEl.textContent = t("catTelegram");
    bodyEl.innerHTML = `<p class="cat-note">${noteHTML()}</p>
      <div class="single-link-wrap">${singleLinkHTML(DATA.telegramCollection.link[0])}</div>`;
  } else {
    const titleKey = { moviesSeries:"catMovies", anime:"catAnime", korean:"catKorean" }[catKey];
    const sites = DATA[catKey].sites;
    const bots = DATA[catKey].bots;
    titleEl.textContent = t(titleKey);
    bodyEl.innerHTML = `<p class="cat-note">${noteHTML()}</p>
      <div class="lists-grid">
        <div class="list-section"><h4>${t("sitesTitle")}</h4>${linkListHTML(sites)}</div>
        <div class="list-section"><h4>${t("botsTitle")}</h4>${linkListHTML(bots)}</div>
      </div>`;
  }

  showScreen("screen-category");
}
